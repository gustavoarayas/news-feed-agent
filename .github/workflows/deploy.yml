name: Deploy to Lambda

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::063474957549:role/github-actions-news-feed-role
          aws-region: us-east-1

      - name: Zip Lambda function
        run: zip lambda.zip lambda_agent.py

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name News-Agent_Practices2026 \
            --zip-file fileb://lambda.zip
          # NOTE: timeout (900s) and memory (512MB) are set manually in the console.
          # The OIDC role does not have lambda:UpdateFunctionConfiguration.
          # Only needs to be done once — code deploys do not reset these settings.
